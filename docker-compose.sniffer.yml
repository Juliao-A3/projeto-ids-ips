services:
  # Banco de dados PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: aegis-db-sniffer
    environment:
      POSTGRES_DB: aegis
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis
    restart: unless-stopped
    network_mode: host
    volumes:
      - aegis-db-sniffer:/var/lib/postgresql/data

  # Backend API com permissões de captura de pacotes para sniffer local
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aegis-api-sniffer
    env_file:
      - .env.sniffer
    network_mode: host
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped
    depends_on:
      - db
    volumes:
      - ./backend:/app/backend:ro
      - ./estudo:/app/estudo:ro
      - ./data:/app/data
      - ./logs:/app/logs
    command: ["sh", "-c", "alembic upgrade head 2>/dev/null || true && uvicorn backend.main:app --host 0.0.0.0 --port 8000"]

  # Frontend (opcional) — serve a interface se desejar containerizar localmente
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: aegis-web-sniffer
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  aegis-db-sniffer:
  postgres_data:
    external: false
