databases:
  - name: aegis-db
    databaseName: aegis
    user: aegis
    plan: starter

services:
  - type: web
    name: aegis-backend
    env: python
    plan: starter
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: alembic upgrade head && uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: CORS_ALLOW_ORIGIN_REGEX
        value: ^https://[a-z0-9-]+\.onrender\.com$
      - key: DATABASE_URL
        fromDatabase:
          name: aegis-db
          property: connectionString

  - type: static
    name: aegis-frontend
    plan: starter
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: https://aegis-backend.onrender.com
