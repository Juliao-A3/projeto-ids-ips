services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aegis}
      POSTGRES_USER: ${POSTGRES_USER:-aegis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegis123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aegis} -d ${POSTGRES_DB:-aegis}"]
      interval: 10s
      timeout: 5s
      retries: 5


  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.cloud
    network_mode: host          # acesso directo à rede da VM
    cap_add:
      - NET_ADMIN
      - NET_RAW
    privileged: true
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aegis}:${POSTGRES_PASSWORD:-aegis123}@127.0.0.1:5432/${POSTGRES_DB:-aegis}
      FRONTEND_ORIGINS: http://192.168.100.27:8080,http://localhost:8080,http://127.0.0.1:8080
    volumes:
      - aegis_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy

  # ─── Frontend React ───────────────────────────────────────
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # ← ESTA É A CORREÇÃO PRINCIPAL
        # O browser acede pelo IP da VM, não por localhost
        VITE_API_URL: http://192.168.100.27:8000
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  postgres_data:
  aegis_logs:
    name: aegis_logs