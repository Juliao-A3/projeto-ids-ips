services:
  sniffer:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    network_mode: host
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    env_file:
      - .env.sniffer
    environment:
      SNIFFER_INTERFACES: ${SNIFFER_INTERFACES:-eth0,eth1}
      SNIFFER_ACTIVE_TIMEOUT: ${SNIFFER_ACTIVE_TIMEOUT:-2}
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-0.70}
      CLOUD_URL: ${CLOUD_URL}
      AGENT_TOKEN: ${AGENT_TOKEN}
    volumes:
      - aegis_logs:/app/logs

volumes:
  aegis_logs:
    name: aegis_logs   # ← nome fixo, sem prefixo do projeto Docker