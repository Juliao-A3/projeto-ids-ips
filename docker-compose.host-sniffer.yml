services:
  db:
    ports:
      - "5432:5432"

  api:
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    privileged: true
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aegis}:${POSTGRES_PASSWORD:-aegis123}@127.0.0.1:5432/${POSTGRES_DB:-aegis}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
    ports: null
